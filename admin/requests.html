<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NIGHTFALL DEVILS Admin - Join Requests"
    >

    <meta
        name="theme-color"
        content="#d71920"
    >

    <title>Join Requests - NIGHTFALL DEVILS</title>


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           ROOT
        ====================================================== */

        :root {

            --red: #d71920;
            --red-dark: #a80f15;

            --gold: #f5c542;
            --gold-light: #fff1a8;

            --white: #ffffff;

            --black: #070707;
            --dark: #0d0d0d;
            --dark-2: #151515;
            --dark-3: #202020;

            --gray: #aaaaaa;
            --gray-light: #dddddd;

            --green: #27ae60;
            --green-light: #5ee58d;

            --orange: #f39c12;

        }


        /* =====================================================
           BODY
        ====================================================== */

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(215, 25, 32, 0.16),
                    transparent 35%
                ),
                var(--dark);

            color: var(--white);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            overflow-x: hidden;

        }


        /* =====================================================
           SIDEBAR
        ====================================================== */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            padding: 25px 16px;

            background:
                linear-gradient(
                    180deg,
                    #111111,
                    #080808
                );

            border-right:
                1px solid
                rgba(245, 197, 66, 0.25);

            z-index: 1000;

        }


        /* =====================================================
           BRAND
        ====================================================== */

        .brand {

            text-align: center;

            padding-bottom: 25px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);

        }


        .brand img {

            width: 72px;
            height: 72px;

            object-fit: contain;

            display: block;

            margin: 0 auto 10px;

        }


        .brand h2 {

            color: var(--white);

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        .brand span {

            display: block;

            margin-top: 5px;

            color: var(--gold);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        /* =====================================================
           SIDEBAR NAVIGATION
        ====================================================== */

        .sidebar-nav {

            margin-top: 25px;

        }


        .sidebar-nav a {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 7px;

            border-radius: 9px;

            color: #cccccc;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s ease;

        }


        .sidebar-nav a:hover {

            background:
                rgba(215, 25, 32, 0.15);

            color: var(--white);

        }


        .sidebar-nav a.active {

            background:
                linear-gradient(
                    135deg,
                    var(--red),
                    var(--red-dark)
                );

            color: var(--white);

            box-shadow:
                0 6px 18px
                rgba(215, 25, 32, 0.25);

        }


        .nav-icon {

            width: 25px;

            text-align: center;

            font-size: 17px;

        }


        /* =====================================================
           LOGOUT
        ====================================================== */

        .logout-btn {

            position: absolute;

            left: 16px;
            right: 16px;
            bottom: 20px;

            width: calc(100% - 32px);

            padding: 12px;

            border:
                1px solid
                rgba(245, 197, 66, 0.4);

            border-radius: 9px;

            background:
                transparent;

            color: var(--gold);

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .logout-btn:hover {

            background: var(--gold);

            color: var(--black);

        }


        /* =====================================================
           MAIN
        ====================================================== */

        .main {

            margin-left: 250px;

            min-height: 100vh;

            padding: 30px;

            width: calc(100% - 250px);

        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;

        }


        .page-title h1 {

            font-size: 30px;

            font-weight: 900;

            letter-spacing: 0.5px;

        }


        .page-title h1 span {

            color: var(--gold);

        }


        .page-title p {

            margin-top: 5px;

            color: var(--gray);

            font-size: 14px;

        }


        .admin-badge {

            padding: 9px 14px;

            border:
                1px solid
                rgba(245, 197, 66, 0.45);

            border-radius: 8px;

            background:
                rgba(245, 197, 66, 0.07);

            color: var(--gold);

            font-size: 12px;

            font-weight: 800;

            white-space: nowrap;

        }


        /* =====================================================
           STATISTICS
        ====================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 16px;

            margin-bottom: 22px;

        }


        .stat-card {

            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #101010
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 12px;

        }


        .stat-label {

            color: var(--gray);

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.5px;

        }


        .stat-number {

            margin-top: 8px;

            color: var(--white);

            font-size: 28px;

            font-weight: 900;

        }


        .stat-card.pending {

            border-top:
                3px solid
                var(--gold);

        }


        .stat-card.approved {

            border-top:
                3px solid
                var(--green);

        }


        .stat-card.rejected {

            border-top:
                3px solid
                var(--red);

        }


        /* =====================================================
           TOOLBAR
        ====================================================== */

        .toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 18px;

            padding: 15px;

            background: #111111;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 12px;

        }


        .filters {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

        }


        .filter-btn {

            padding: 9px 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 7px;

            background: #1a1a1a;

            color: #bbbbbb;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .filter-btn:hover {

            border-color:
                rgba(245, 197, 66, 0.4);

            color: var(--white);

        }


        .filter-btn.active {

            background: var(--red);

            border-color: var(--red);

            color: var(--white);

        }


        .search-box {

            width: 280px;

            flex-shrink: 0;

        }


        .search-box input {

            width: 100%;

            height: 40px;

            padding: 0 13px;

            border:
                1px solid
                #333333;

            border-radius: 7px;

            outline: none;

            background: #1a1a1a;

            color: var(--white);

            font-size: 13px;

        }


        .search-box input::placeholder {

            color: #777777;

        }


        .search-box input:focus {

            border-color: var(--gold);

        }


        /* =====================================================
           TABLE OUTER
        ====================================================== */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            overflow-y: hidden;

            background:
                #101010;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 12px;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: thin;

            scrollbar-color:
                var(--gold)
                #181818;

        }


        .table-wrapper::-webkit-scrollbar {

            height: 10px;

        }


        .table-wrapper::-webkit-scrollbar-track {

            background: #181818;

        }


        .table-wrapper::-webkit-scrollbar-thumb {

            background: var(--gold);

            border-radius: 10px;

        }


        .table-wrapper::-webkit-scrollbar-thumb:hover {

            background: var(--gold-light);

        }


        /* =====================================================
           EXCEL TABLE
        ====================================================== */

        .requests-table {

            width: 100%;

            min-width: 1150px;

            border-collapse: separate;

            border-spacing: 0;

            table-layout: fixed;

        }


        /* =====================================================
           TABLE HEADER
        ====================================================== */

        .requests-table thead th {

            position: sticky;

            top: 0;

            z-index: 10;

            padding: 13px 12px;

            background:
                #191919;

            border-bottom:
                2px solid
                rgba(245, 197, 66, 0.45);

            border-right:
                1px solid
                rgba(255, 255, 255, 0.07);

            color: var(--gold);

            font-size: 11px;

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            text-align: left;

            white-space: nowrap;

        }


        .requests-table thead th:last-child {

            border-right: none;

        }


        /* =====================================================
           COLUMN WIDTHS
        ====================================================== */

        .col-no {

            width: 55px;

            text-align: center !important;

        }


        .col-user {

            width: 190px;

        }


        .col-display {

            width: 180px;

        }


        .col-referred {

            width: 170px;

        }


        .col-message {

            width: 300px;

        }


        .col-date {

            width: 175px;

        }


        .col-status {

            width: 110px;

            text-align: center !important;

        }


        .col-actions {

            width: 245px;

            text-align: center !important;

        }


        /* =====================================================
           TABLE BODY
        ====================================================== */

        .requests-table tbody tr {

            background: #111111;

            transition:
                background 0.15s ease;

        }


        .requests-table tbody tr:nth-child(even) {

            background: #151515;

        }


        .requests-table tbody tr:hover {

            background:
                rgba(245, 197, 66, 0.055);

        }


        .requests-table tbody td {

            padding: 13px 12px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-right:
                1px solid
                rgba(255, 255, 255, 0.05);

            color: #eeeeee;

            font-size: 13px;

            vertical-align: middle;

        }


        .requests-table tbody td:last-child {

            border-right: none;

        }


        .requests-table tbody tr:last-child td {

            border-bottom: none;

        }


        /* =====================================================
           ROW NUMBER
        ====================================================== */

        .row-number {

            color: #777777;

            font-size: 12px;

            font-weight: 800;

            text-align: center;

        }


        /* =====================================================
           USER CELL
        ====================================================== */

        .user-cell {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;

        }


        .user-avatar {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--red),
                    var(--red-dark)
                );

            border:
                2px solid
                var(--gold);

            font-size: 16px;

        }


        .user-cell-info {

            min-width: 0;

        }


        .user-name {

            color: var(--white);

            font-size: 13px;

            font-weight: 900;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .user-tiktok {

            margin-top: 3px;

            color: var(--gold);

            font-size: 11px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* =====================================================
           NORMAL CELL
        ====================================================== */

        .cell-text {

            color: #eeeeee;

            font-size: 13px;

            font-weight: 600;

            word-break: break-word;

        }


        .cell-muted {

            color: #777777;

        }


        /* =====================================================
           MESSAGE CELL
        ====================================================== */

        .message-cell {

            max-width: 300px;

            color: #cccccc;

            font-size: 12px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-break: break-word;

        }


        .message-empty {

            color: #666666;

            font-style: italic;

        }


        /* =====================================================
           DATE CELL
        ====================================================== */

        .date-cell {

            color: #999999;

            font-size: 11px;

            white-space: nowrap;

        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status-badge {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 82px;

            padding: 6px 10px;

            border-radius: 5px;

            font-size: 10px;

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 0.4px;

        }


        .status-pending {

            background:
                rgba(245, 197, 66, 0.12);

            color: var(--gold);

            border:
                1px solid
                rgba(245, 197, 66, 0.35);

        }


        .status-approved {

            background:
                rgba(39, 174, 96, 0.12);

            color:
                var(--green-light);

            border:
                1px solid
                rgba(39, 174, 96, 0.35);

        }


        .status-rejected {

            background:
                rgba(215, 25, 32, 0.12);

            color:
                #ff7777;

            border:
                1px solid
                rgba(215, 25, 32, 0.35);

        }


        /* =====================================================
           ACTIONS
        ====================================================== */

        .table-actions {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            white-space: nowrap;

        }


        .action-btn {

            min-width: 70px;

            padding: 7px 9px;

            border-radius: 5px;

            font-size: 10px;

            font-weight: 900;

            cursor: pointer;

            border: 1px solid transparent;

            transition:
                0.18s ease;

        }


        .approve-btn {

            background:
                rgba(39, 174, 96, 0.12);

            color:
                var(--green-light);

            border-color:
                rgba(39, 174, 96, 0.35);

        }


        .approve-btn:hover {

            background: var(--green);

            color: var(--white);

        }


        .reject-btn {

            background:
                rgba(215, 25, 32, 0.12);

            color:
                #ff7777;

            border-color:
                rgba(215, 25, 32, 0.35);

        }


        .reject-btn:hover {

            background: var(--red);

            color: var(--white);

        }


        .delete-btn {

            background:
                rgba(255, 255, 255, 0.05);

            color: #bbbbbb;

            border-color:
                rgba(255, 255, 255, 0.12);

        }


        .delete-btn:hover {

            background: #333333;

            color: var(--white);

        }


        /* =====================================================
           EMPTY STATE
        ====================================================== */

        .empty-state {

            padding: 60px 20px;

            text-align: center;

            background: #111111;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 12px;

        }


        .empty-icon {

            font-size: 45px;

            margin-bottom: 12px;

        }


        .empty-state h3 {

            color: var(--white);

            font-size: 18px;

        }


        .empty-state p {

            margin-top: 7px;

            color: #777777;

            font-size: 13px;

        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading {

            padding: 50px;

            text-align: center;

            color: var(--gold);

            font-size: 14px;

            font-weight: 800;

        }


        /* =====================================================
           TABLE INFO
        ====================================================== */

        .table-info {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-top: 9px;

            color: #666666;

            font-size: 10px;

        }


        .scroll-hint {

            display: none;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 1100px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        /* =====================================================
           900 PX
        ====================================================== */

        @media (max-width: 900px) {

            .sidebar {

                width: 210px;

            }


            .main {

                margin-left: 210px;

                width: calc(100% - 210px);

                padding: 20px;

            }


            .toolbar {

                align-items: stretch;

                flex-direction: column;

            }


            .search-box {

                width: 100%;

            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            body {

                overflow-x: hidden;

            }


            .sidebar {

                position: relative;

                width: 100%;

                height: auto;

                padding: 15px;

                border-right: none;

                border-bottom:
                    1px solid
                    rgba(245, 197, 66, 0.2);

            }


            .brand {

                padding-bottom: 15px;

            }


            .brand img {

                width: 55px;

                height: 55px;

            }


            .brand h2 {

                font-size: 15px;

            }


            .sidebar-nav {

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 5px;

                margin-top: 15px;

            }


            .sidebar-nav a {

                margin: 0;

                padding: 10px;

                justify-content: center;

                font-size: 11px;

            }


            .nav-icon {

                display: none;

            }


            .logout-btn {

                position: static;

                width: 100%;

                margin-top: 10px;

            }


            .main {

                margin-left: 0;

                width: 100%;

                padding: 14px;

            }


            .topbar {

                align-items: flex-start;

                flex-direction: column;

                gap: 10px;

            }


            .page-title h1 {

                font-size: 23px;

            }


            .page-title p {

                font-size: 12px;

                line-height: 1.5;

            }


            .admin-badge {

                font-size: 10px;

            }


            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 8px;

            }


            .stat-card {

                padding: 14px;

            }


            .stat-label {

                font-size: 9px;

            }


            .stat-number {

                font-size: 21px;

            }


            .toolbar {

                padding: 12px;

            }


            .filters {

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                width: 100%;

            }


            .filter-btn {

                width: 100%;

                padding: 9px 7px;

                font-size: 10px;

            }


            .search-box {

                width: 100%;

            }


            .table-wrapper {

                border-radius: 9px;

            }


            .requests-table {

                min-width: 1150px;

            }


            .table-info {

                display: block;

                line-height: 1.6;

            }


            .scroll-hint {

                display: block;

                color: var(--gold);

                font-weight: 800;

            }

        }


        /* =====================================================
           SMALL PHONE
        ====================================================== */

        @media (max-width: 380px) {

            .sidebar-nav {

                grid-template-columns: 1fr;

            }


            .stats {

                grid-template-columns: 1fr 1fr;

            }


            .main {

                padding: 10px;

            }


            .page-title h1 {

                font-size: 21px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <img
                src="../assets/logo/nightfall-devils-logo.png"
                alt="NIGHTFALL DEVILS Logo"
            >

            <h2>
                NIGHTFALL DEVILS
            </h2>

            <span>
                ADMIN PANEL
            </span>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html">

                <span class="nav-icon">
                    📊
                </span>

                Dashboard

            </a>


            <a
                href="requests.html"
                class="active"
            >

                <span class="nav-icon">
                    📋
                </span>

                Join Requests

            </a>


            <a href="members.html">

                <span class="nav-icon">
                    👥
                </span>

                Members

            </a>


            <a href="schedule.html">

                <span class="nav-icon">
                    📅
                </span>

                Schedule

            </a>


            <a href="announcements.html">

                <span class="nav-icon">
                    📢
                </span>

                Announcements

            </a>

        </nav>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            🚪 LOGOUT
        </button>

    </aside>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <div class="topbar">

            <div class="page-title">

                <h1>
                    JOIN
                    <span>REQUESTS</span>
                </h1>

                <p>
                    Review and manage NIGHTFALL DEVILS membership requests.
                </p>

            </div>


            <div
                class="admin-badge"
                id="adminEmail"
            >
                ADMIN
            </div>

        </div>



        <!-- =================================================
             STATISTICS
        ================================================== -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    Total Requests
                </div>

                <div
                    class="stat-number"
                    id="totalCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card pending">

                <div class="stat-label">
                    Pending
                </div>

                <div
                    class="stat-number"
                    id="pendingCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card approved">

                <div class="stat-label">
                    Approved
                </div>

                <div
                    class="stat-number"
                    id="approvedCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card rejected">

                <div class="stat-label">
                    Rejected
                </div>

                <div
                    class="stat-number"
                    id="rejectedCount"
                >
                    0
                </div>

            </div>

        </section>



        <!-- =================================================
             TOOLBAR
        ================================================== -->

        <section class="toolbar">

            <div class="filters">

                <button
                    class="filter-btn active"
                    data-filter="all"
                >
                    ALL
                </button>

                <button
                    class="filter-btn"
                    data-filter="pending"
                >
                    PENDING
                </button>

                <button
                    class="filter-btn"
                    data-filter="approved"
                >
                    APPROVED
                </button>

                <button
                    class="filter-btn"
                    data-filter="rejected"
                >
                    REJECTED
                </button>

            </div>


            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search username or name..."
                    autocomplete="off"
                >

            </div>

        </section>



        <!-- =================================================
             REQUESTS TABLE
        ================================================== -->

        <section id="requestsContainer">

            <div class="loading">

                ⏳ Loading join requests...

            </div>

        </section>


    </main>



    <!-- =====================================================
         FIREBASE
    ====================================================== -->

    <script type="module">

        /* =================================================
           FIREBASE FIRESTORE
        ================================================= */

        import {
            collection,
            onSnapshot,
            doc,
            updateDoc,
            deleteDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


        /* =================================================
           FIREBASE AUTH
        ================================================= */

        import {
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


        /* =================================================
           LOCAL FIREBASE BRIDGE
        ================================================= */

        import {
            auth,
            db
        } from "../js/firebase.js";


        /* =================================================
           ELEMENTS
        ================================================= */

        const requestsContainer =
            document.getElementById(
                "requestsContainer"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const adminEmail =
            document.getElementById(
                "adminEmail"
            );


        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        const totalCount =
            document.getElementById(
                "totalCount"
            );


        const pendingCount =
            document.getElementById(
                "pendingCount"
            );


        const approvedCount =
            document.getElementById(
                "approvedCount"
            );


        const rejectedCount =
            document.getElementById(
                "rejectedCount"
            );


        /* =================================================
           VARIABLES
        ================================================= */

        let allRequests = [];

        let currentFilter = "all";

        let currentSearch = "";


        /* =================================================
           AUTH CHECK
        ================================================= */

        onAuthStateChanged(
            auth,
            function(user) {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                adminEmail.textContent =
                    user.email || "ADMIN";


                loadRequests();

            }
        );


        /* =================================================
           LOAD REQUESTS
        ================================================= */

        function loadRequests() {

            const requestsRef =
                collection(
                    db,
                    "memberRequests"
                );


            onSnapshot(

                requestsRef,

                function(snapshot) {

                    allRequests = [];


                    snapshot.forEach(
                        function(docSnapshot) {

                            allRequests.push({

                                id:
                                    docSnapshot.id,

                                ...docSnapshot.data()

                            });

                        }
                    );


                    /* =====================================
                       SORT NEWEST FIRST
                    ====================================== */

                    allRequests.sort(
                        function(a, b) {

                            const dateA =
                                getTimestampValue(
                                    a.createdAt
                                );


                            const dateB =
                                getTimestampValue(
                                    b.createdAt
                                );


                            return dateB - dateA;

                        }
                    );


                    updateStatistics();

                    renderRequests();

                },


                function(error) {

                    console.error(
                        "REQUEST LOAD ERROR:",
                        error
                    );


                    requestsContainer.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                ⚠️
                            </div>

                            <h3>
                                Unable to Load Requests
                            </h3>

                            <p>
                                Please check your Firestore
                                security rules.
                            </p>

                        </div>

                    `;

                }

            );

        }


        /* =================================================
           STATISTICS
        ================================================== */

        function updateStatistics() {

            const total =
                allRequests.length;


            const pending =
                allRequests.filter(
                    request =>
                        request.status === "pending"
                ).length;


            const approved =
                allRequests.filter(
                    request =>
                        request.status === "approved"
                ).length;


            const rejected =
                allRequests.filter(
                    request =>
                        request.status === "rejected"
                ).length;


            totalCount.textContent =
                total;


            pendingCount.textContent =
                pending;


            approvedCount.textContent =
                approved;


            rejectedCount.textContent =
                rejected;

        }


        /* =================================================
           FILTER BUTTONS
        ================================================== */

        document
            .querySelectorAll(".filter-btn")
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            document
                                .querySelectorAll(
                                    ".filter-btn"
                                )
                                .forEach(
                                    btn =>
                                        btn.classList.remove(
                                            "active"
                                        )
                                );


                            this.classList.add(
                                "active"
                            );


                            currentFilter =
                                this.dataset.filter;


                            renderRequests();

                        }
                    );

                }
            );


        /* =================================================
           SEARCH
        ================================================== */

        searchInput.addEventListener(
            "input",
            function() {

                currentSearch =
                    this.value
                        .trim()
                        .toLowerCase();


                renderRequests();

            }
        );


        /* =================================================
           RENDER REQUESTS
        ================================================== */

        function renderRequests() {

            let filtered =
                [...allRequests];


            /* =============================================
               STATUS FILTER
            ============================================== */

            if (
                currentFilter !== "all"
            ) {

                filtered =
                    filtered.filter(
                        request =>
                            request.status ===
                            currentFilter
                    );

            }


            /* =============================================
               SEARCH FILTER
            ============================================== */

            if (currentSearch) {

                filtered =
                    filtered.filter(
                        function(request) {

                            const username =
                                String(
                                    request.tiktokUsername || ""
                                ).toLowerCase();


                            const displayName =
                                String(
                                    request.displayName || ""
                                ).toLowerCase();


                            const referredBy =
                                String(
                                    request.referredBy || ""
                                ).toLowerCase();


                            const message =
                                String(
                                    request.message || ""
                                ).toLowerCase();


                            return (

                                username.includes(
                                    currentSearch
                                )

                                ||

                                displayName.includes(
                                    currentSearch
                                )

                                ||

                                referredBy.includes(
                                    currentSearch
                                )

                                ||

                                message.includes(
                                    currentSearch
                                )

                            );

                        }
                    );

            }


            /* =============================================
               EMPTY
            ============================================== */

            if (
                filtered.length === 0
            ) {

                requestsContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            📭
                        </div>

                        <h3>
                            No Join Requests
                        </h3>

                        <p>
                            There are no requests matching
                            your current filter.
                        </p>

                    </div>

                `;

                return;

            }


            /* =============================================
               TABLE
            ============================================== */

            let tableRows = "";


            filtered.forEach(
                function(request, index) {

                    tableRows +=
                        createRequestRow(
                            request,
                            index + 1
                        );

                }
            );


            requestsContainer.innerHTML = `

                <div class="table-wrapper">

                    <table class="requests-table">

                        <thead>

                            <tr>

                                <th class="col-no">
                                    #
                                </th>

                                <th class="col-user">
                                    MEMBER / TIKTOK
                                </th>

                                <th class="col-display">
                                    DISPLAY NAME
                                </th>

                                <th class="col-referred">
                                    REFERRED BY
                                </th>

                                <th class="col-message">
                                    MESSAGE TO ADMIN
                                </th>

                                <th class="col-date">
                                    SUBMITTED
                                </th>

                                <th class="col-status">
                                    STATUS
                                </th>

                                <th class="col-actions">
                                    ACTIONS
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${tableRows}

                        </tbody>

                    </table>

                </div>


                <div class="table-info">

                    <span>
                        Showing
                        <strong>
                            ${filtered.length}
                        </strong>
                        request(s)
                    </span>

                    <span class="scroll-hint">
                        ← Swipe left / right to view table →
                    </span>

                </div>

            `;


            attachActionEvents();

        }


        /* =================================================
           CREATE TABLE ROW
        ================================================== */

        function createRequestRow(
            request,
            index
        ) {

            const status =
                request.status || "pending";


            const statusClass =
                "status-" + status;


            const statusText =
                status.toUpperCase();


            const username =
                cleanUsername(
                    request.tiktokUsername
                );


            const displayName =
                request.displayName ||
                "—";


            const referredBy =
                request.referredBy ||
                "—";


            const message =
                request.message ||
                "";


            const date =
                formatDate(
                    request.createdAt
                );


            return `

                <tr
                    data-id="${escapeHTML(
                        request.id
                    )}"
                >


                    <!-- =================================
                         NUMBER
                    ================================== -->

                    <td class="row-number">

                        ${index}

                    </td>


                    <!-- =================================
                         MEMBER / TIKTOK
                    ================================== -->

                    <td>

                        <div class="user-cell">

                            <div class="user-avatar">
                                👤
                            </div>


                            <div class="user-cell-info">

                                <div class="user-name">

                                    ${escapeHTML(
                                        displayName
                                    )}

                                </div>


                                <div class="user-tiktok">

                                    @${escapeHTML(
                                        username
                                    )}

                                </div>

                            </div>

                        </div>

                    </td>


                    <!-- =================================
                         DISPLAY NAME
                    ================================== -->

                    <td>

                        <div class="cell-text">

                            ${escapeHTML(
                                displayName
                            )}

                        </div>

                    </td>


                    <!-- =================================
                         REFERRED BY
                    ================================== -->

                    <td>

                        <div
                            class="
                                cell-text
                                ${
                                    referredBy === "—"
                                        ? "cell-muted"
                                        : ""
                                }
                            "
                        >

                            ${escapeHTML(
                                referredBy
                            )}

                        </div>

                    </td>


                    <!-- =================================
                         MESSAGE
                    ================================== -->

                    <td>

                        ${
                            message
                            ?
                            `
                            <div class="message-cell">

                                ${escapeHTML(
                                    message
                                )}

                            </div>
                            `
                            :
                            `
                            <div
                                class="
                                    message-cell
                                    message-empty
                                "
                            >
                                No message provided.
                            </div>
                            `
                        }

                    </td>


                    <!-- =================================
                         DATE
                    ================================== -->

                    <td>

                        <div class="date-cell">

                            ${escapeHTML(
                                date
                            )}

                        </div>

                    </td>


                    <!-- =================================
                         STATUS
                    ================================== -->

                    <td>

                        <span
                            class="
                                status-badge
                                ${statusClass}
                            "
                        >

                            ${statusText}

                        </span>

                    </td>


                    <!-- =================================
                         ACTIONS
                    ================================== -->

                    <td>

                        <div class="table-actions">


                            ${
                                status !== "approved"
                                ?
                                `
                                <button
                                    type="button"
                                    class="
                                        action-btn
                                        approve-btn
                                    "
                                    data-action="approve"
                                    data-id="${escapeHTML(
                                        request.id
                                    )}"
                                >
                                    ✓ APPROVE
                                </button>
                                `
                                :
                                ""
                            }


                            ${
                                status !== "rejected"
                                ?
                                `
                                <button
                                    type="button"
                                    class="
                                        action-btn
                                        reject-btn
                                    "
                                    data-action="reject"
                                    data-id="${escapeHTML(
                                        request.id
                                    )}"
                                >
                                    ✕ REJECT
                                </button>
                                `
                                :
                                ""
                            }


                            <button
                                type="button"
                                class="
                                    action-btn
                                    delete-btn
                                "
                                data-action="delete"
                                data-id="${escapeHTML(
                                    request.id
                                )}"
                            >
                                🗑 DELETE
                            </button>


                        </div>

                    </td>


                </tr>

            `;

        }


        /* =================================================
           ACTION EVENTS
        ================================================== */

        function attachActionEvents() {

            document
                .querySelectorAll(
                    "[data-action]"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const action =
                                    this.dataset.action;


                                const id =
                                    this.dataset.id;


                                /* =====================
                                   APPROVE
                                ====================== */

                                if (
                                    action ===
                                    "approve"
                                ) {

                                    await changeStatus(
                                        id,
                                        "approved"
                                    );

                                }


                                /* =====================
                                   REJECT
                                ====================== */

                                if (
                                    action ===
                                    "reject"
                                ) {

                                    await changeStatus(
                                        id,
                                        "rejected"
                                    );

                                }


                                /* =====================
                                   DELETE
                                ====================== */

                                if (
                                    action ===
                                    "delete"
                                ) {

                                    await deleteRequest(
                                        id
                                    );

                                }

                            }
                        );

                    }
                );

        }


        /* =================================================
           CHANGE STATUS
        ================================================== */

        async function changeStatus(
            id,
            status
        ) {

            const actionText =
                status === "approved"
                    ? "approve"
                    : "reject";


            const confirmed =
                confirm(
                    `Are you sure you want to ${actionText} this request?`
                );


            if (!confirmed) {

                return;

            }


            try {

                const user =
                    auth.currentUser;


                await updateDoc(

                    doc(
                        db,
                        "memberRequests",
                        id
                    ),

                    {

                        status:
                            status,

                        reviewedAt:
                            serverTimestamp(),

                        reviewedBy:
                            user
                                ? user.email
                                : "admin"

                    }

                );


            } catch (error) {

                console.error(
                    "STATUS UPDATE ERROR:",
                    error
                );


                alert(
                    "Unable to update this request. Please check Firestore permissions."
                );

            }

        }


        /* =================================================
           DELETE REQUEST
        ================================================== */

        async function deleteRequest(
            id
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to permanently delete this request?"
                );


            if (!confirmed) {

                return;

            }


            try {

                await deleteDoc(

                    doc(
                        db,
                        "memberRequests",
                        id
                    )

                );


            } catch (error) {

                console.error(
                    "DELETE ERROR:",
                    error
                );


                alert(
                    "Unable to delete this request. Please check Firestore permissions."
                );

            }

        }


        /* =================================================
           CLEAN USERNAME
        ================================================== */

        function cleanUsername(
            username
        ) {

            return String(
                username || ""
            ).replace(
                /^@/,
                ""
            );

        }


        /* =================================================
           TIMESTAMP VALUE
        ================================================== */

        function getTimestampValue(
            timestamp
        ) {

            if (!timestamp) {

                return 0;

            }


            if (
                typeof timestamp.toMillis ===
                "function"
            ) {

                return timestamp.toMillis();

            }


            if (
                timestamp.seconds
            ) {

                return (
                    timestamp.seconds *
                    1000
                );

            }


            if (
                timestamp instanceof Date
            ) {

                return timestamp.getTime();

            }


            return 0;

        }


        /* =================================================
           FORMAT DATE
        ================================================== */

        function formatDate(
            timestamp
        ) {

            const value =
                getTimestampValue(
                    timestamp
                );


            if (!value) {

                return "Just now";

            }


            return new Date(
                value
            ).toLocaleString(
                undefined,
                {

                    year:
                        "numeric",

                    month:
                        "short",

                    day:
                        "numeric",

                    hour:
                        "2-digit",

                    minute:
                        "2-digit"

                }
            );

        }


        /* =================================================
           HTML ESCAPE
        ================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =================================================
           LOGOUT
        ================================================== */

        logoutBtn.addEventListener(
            "click",
            async function() {

                const confirmed =
                    confirm(
                        "Are you sure you want to logout?"
                    );


                if (!confirmed) {

                    return;

                }


                try {

                    await signOut(
                        auth
                    );


                    window.location.href =
                        "login.html";


                } catch (error) {

                    console.error(
                        "LOGOUT ERROR:",
                        error
                    );


                    alert(
                        "Unable to logout."
                    );

                }

            }
        );

    </script>


</body>

</html>
