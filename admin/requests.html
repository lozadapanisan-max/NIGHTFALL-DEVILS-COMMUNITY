<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NIGHTFALL DEVILS Admin - Join Requests"
    >

    <meta
        name="theme-color"
        content="#d71920"
    >

    <title>Join Requests - NIGHTFALL DEVILS</title>


    <!-- =====================================================
         FIREBASE / PAGE STYLE
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --red: #d71920;
            --red-dark: #a80f15;

            --gold: #f5c542;
            --gold-light: #fff1a8;

            --white: #ffffff;

            --black: #070707;
            --dark: #0d0d0d;
            --dark-2: #151515;
            --dark-3: #202020;

            --gray: #aaaaaa;
            --gray-light: #dddddd;

            --green: #27ae60;
            --orange: #f39c12;

        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(215, 25, 32, 0.16),
                    transparent 35%
                ),
                var(--dark);

            color: var(--white);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            padding: 25px 16px;

            background:
                linear-gradient(
                    180deg,
                    #111111,
                    #080808
                );

            border-right:
                1px solid
                rgba(245, 197, 66, 0.25);

            z-index: 1000;

        }


        .brand {

            text-align: center;

            padding-bottom: 25px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

        }


        .brand img {

            width: 72px;
            height: 72px;

            object-fit: contain;

            display: block;

            margin: 0 auto 10px;

        }


        .brand h2 {

            color: var(--white);

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        .brand span {

            display: block;

            margin-top: 5px;

            color: var(--gold);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .sidebar-nav {

            margin-top: 25px;

        }


        .sidebar-nav a {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 7px;

            border-radius: 9px;

            color: #cccccc;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition:
                0.2s ease;

        }


        .sidebar-nav a:hover {

            background:
                rgba(215,25,32,0.15);

            color: var(--white);

        }


        .sidebar-nav a.active {

            background:
                linear-gradient(
                    135deg,
                    var(--red),
                    var(--red-dark)
                );

            color: var(--white);

            box-shadow:
                0 6px 18px
                rgba(215,25,32,0.25);

        }


        .nav-icon {

            width: 25px;

            text-align: center;

            font-size: 17px;

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        .logout-btn {

            position: absolute;

            left: 16px;
            right: 16px;
            bottom: 20px;

            width: calc(100% - 32px);

            padding: 12px;

            border:
                1px solid
                rgba(245,197,66,0.4);

            border-radius: 9px;

            background:
                transparent;

            color: var(--gold);

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

        }


        .logout-btn:hover {

            background: var(--gold);

            color: var(--black);

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            margin-left: 250px;

            min-height: 100vh;

            padding: 30px;

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;

        }


        .page-title h1 {

            font-size: 30px;

            font-weight: 900;

        }


        .page-title h1 span {

            color: var(--gold);

        }


        .page-title p {

            margin-top: 5px;

            color: var(--gray);

            font-size: 14px;

        }


        .admin-badge {

            padding: 9px 14px;

            border:
                1px solid
                rgba(245,197,66,0.45);

            border-radius: 8px;

            background:
                rgba(245,197,66,0.07);

            color: var(--gold);

            font-size: 12px;

            font-weight: 800;

        }


        /* =====================================================
           STAT CARDS
        ===================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 16px;

            margin-bottom: 22px;

        }


        .stat-card {

            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #101010
                );

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 12px;

        }


        .stat-label {

            color: var(--gray);

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.5px;

        }


        .stat-number {

            margin-top: 8px;

            color: var(--white);

            font-size: 28px;

            font-weight: 900;

        }


        .stat-card.pending {

            border-top:
                3px solid
                var(--gold);

        }


        .stat-card.approved {

            border-top:
                3px solid
                var(--green);

        }


        .stat-card.rejected {

            border-top:
                3px solid
                var(--red);

        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 18px;

            padding: 15px;

            background: #111111;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 12px;

        }


        .filters {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

        }


        .filter-btn {

            padding: 9px 14px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 7px;

            background: #1a1a1a;

            color: #bbbbbb;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

        }


        .filter-btn.active {

            background: var(--red);

            border-color: var(--red);

            color: var(--white);

        }


        .search-box {

            width: 260px;

        }


        .search-box input {

            width: 100%;

            height: 40px;

            padding: 0 13px;

            border:
                1px solid
                #333333;

            border-radius: 7px;

            outline: none;

            background: #1a1a1a;

            color: var(--white);

            font-size: 13px;

        }


        .search-box input:focus {

            border-color: var(--gold);

        }


        /* =====================================================
           REQUESTS CONTAINER
        ===================================================== */

        .requests-container {

            display: grid;

            gap: 14px;

        }


        /* =====================================================
           REQUEST CARD
        ===================================================== */

        .request-card {

            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #101010
                );

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 13px;

            transition:
                border-color 0.2s ease,
                transform 0.2s ease;

        }


        .request-card:hover {

            border-color:
                rgba(245,197,66,0.35);

            transform:
                translateY(-1px);

        }


        .request-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 16px;

        }


        .request-user {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .user-avatar {

            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--red),
                    var(--red-dark)
                );

            border:
                2px solid
                var(--gold);

            font-size: 20px;

        }


        .user-info h3 {

            color: var(--white);

            font-size: 17px;

            font-weight: 900;

        }


        .user-info p {

            margin-top: 3px;

            color: var(--gold);

            font-size: 13px;

        }


        .status-badge {

            display: inline-flex;

            align-items: center;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 900;

            text-transform: uppercase;

        }


        .status-pending {

            background:
                rgba(245,197,66,0.12);

            color: var(--gold);

            border:
                1px solid
                rgba(245,197,66,0.3);

        }


        .status-approved {

            background:
                rgba(39,174,96,0.12);

            color: #5ee58d;

            border:
                1px solid
                rgba(39,174,96,0.3);

        }


        .status-rejected {

            background:
                rgba(215,25,32,0.12);

            color: #ff7777;

            border:
                1px solid
                rgba(215,25,32,0.3);

        }


        /* =====================================================
           REQUEST DETAILS
        ===================================================== */

        .request-details {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 15px;

        }


        .detail-box {

            padding: 12px;

            background: #101010;

            border:
                1px solid
                rgba(255,255,255,0.06);

            border-radius: 8px;

        }


        .detail-label {

            color: #777777;

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;

            margin-bottom: 5px;

        }


        .detail-value {

            color: #eeeeee;

            font-size: 13px;

            font-weight: 700;

            word-break: break-word;

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .request-message {

            margin-bottom: 15px;

            padding: 13px 14px;

            background:
                rgba(255,255,255,0.025);

            border-left:
                3px solid
                var(--gold);

            border-radius: 6px;

        }


        .request-message .message-label {

            margin-bottom: 5px;

            color: var(--gold);

            font-size: 11px;

            font-weight: 900;

            text-transform: uppercase;

        }


        .request-message p {

            color: #cccccc;

            font-size: 13px;

            line-height: 1.6;

            white-space: pre-wrap;

        }


        /* =====================================================
           REQUEST FOOTER
        ===================================================== */

        .request-footer {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            padding-top: 14px;

            border-top:
                1px solid
                rgba(255,255,255,0.06);

        }


        .request-date {

            color: #777777;

            font-size: 11px;

        }


        .request-actions {

            display: flex;

            gap: 7px;

            flex-wrap: wrap;

            justify-content: flex-end;

        }


        .action-btn {

            padding: 8px 12px;

            border-radius: 7px;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;

            border: 1px solid transparent;

        }


        .approve-btn {

            background:
                rgba(39,174,96,0.12);

            color: #5ee58d;

            border-color:
                rgba(39,174,96,0.35);

        }


        .approve-btn:hover {

            background: var(--green);

            color: var(--white);

        }


        .reject-btn {

            background:
                rgba(215,25,32,0.12);

            color: #ff7777;

            border-color:
                rgba(215,25,32,0.35);

        }


        .reject-btn:hover {

            background: var(--red);

            color: var(--white);

        }


        .delete-btn {

            background:
                rgba(255,255,255,0.05);

            color: #bbbbbb;

            border-color:
                rgba(255,255,255,0.12);

        }


        .delete-btn:hover {

            background: #333333;

            color: var(--white);

        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .empty-state {

            padding: 60px 20px;

            text-align: center;

            background: #111111;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 13px;

        }


        .empty-icon {

            font-size: 45px;

            margin-bottom: 12px;

        }


        .empty-state h3 {

            color: var(--white);

            font-size: 18px;

        }


        .empty-state p {

            margin-top: 7px;

            color: #777777;

            font-size: 13px;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            padding: 50px;

            text-align: center;

            color: var(--gold);

            font-size: 14px;

            font-weight: 800;

        }


        /* =====================================================
           MOBILE MENU
        ===================================================== */

        .mobile-topbar {

            display: none;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 1000px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            .request-details {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 750px) {

            .sidebar {

                width: 210px;

            }

            .main {

                margin-left: 210px;

                padding: 20px;

            }

            .toolbar {

                align-items: stretch;

                flex-direction: column;

            }

            .search-box {

                width: 100%;

            }

        }


        @media (max-width: 600px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;

                padding: 15px;

                border-right: none;

                border-bottom:
                    1px solid
                    rgba(245,197,66,0.2);

            }

            .brand {

                padding-bottom: 15px;

            }

            .brand img {

                width: 55px;
                height: 55px;

            }

            .sidebar-nav {

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 5px;

                margin-top: 15px;

            }

            .sidebar-nav a {

                margin: 0;

                padding: 10px;

                justify-content: center;

                font-size: 11px;

            }

            .nav-icon {

                display: none;

            }

            .logout-btn {

                position: static;

                width: 100%;

                margin-top: 10px;

            }

            .main {

                margin-left: 0;

                padding: 16px;

            }

            .topbar {

                align-items: flex-start;

                flex-direction: column;

            }

            .page-title h1 {

                font-size: 25px;

            }

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;

            }

            .stat-card {

                padding: 15px;

            }

            .stat-number {

                font-size: 23px;

            }

            .request-header {

                flex-direction: column;

            }

            .request-details {

                grid-template-columns: 1fr;

            }

            .request-footer {

                align-items: stretch;

                flex-direction: column;

            }

            .request-actions {

                justify-content: flex-start;

            }

        }


        @media (max-width: 380px) {

            .sidebar-nav {

                grid-template-columns: 1fr;

            }

            .stats {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>

    <!-- =====================================================
         FIREBASE
    ====================================================== -->

    <script type="module">

        import {
            collection,
            onSnapshot,
            doc,
            updateDoc,
            deleteDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


        import {
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


        import {
            auth,
            db
        } from "../js/firebase.js";


        /* =================================================
           ELEMENTS
        ================================================= */

        const requestsContainer =
            document.getElementById(
                "requestsContainer"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const adminEmail =
            document.getElementById(
                "adminEmail"
            );

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        const totalCount =
            document.getElementById(
                "totalCount"
            );

        const pendingCount =
            document.getElementById(
                "pendingCount"
            );

        const approvedCount =
            document.getElementById(
                "approvedCount"
            );

        const rejectedCount =
            document.getElementById(
                "rejectedCount"
            );


        let allRequests = [];

        let currentFilter = "all";

        let currentSearch = "";


        /* =================================================
           AUTH CHECK
        ================================================= */

        onAuthStateChanged(
            auth,
            function(user) {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                adminEmail.textContent =
                    user.email || "ADMIN";


                loadRequests();

            }
        );


        /* =================================================
           LOAD REQUESTS
        ================================================= */

        function loadRequests() {

            const requestsRef =
                collection(
                    db,
                    "memberRequests"
                );


            onSnapshot(
                requestsRef,

                function(snapshot) {

                    allRequests = [];


                    snapshot.forEach(
                        function(docSnapshot) {

                            allRequests.push({

                                id:
                                    docSnapshot.id,

                                ...docSnapshot.data()

                            });

                        }
                    );


                    /* -------------------------------------
                       SORT NEWEST FIRST
                    ------------------------------------- */

                    allRequests.sort(
                        function(a, b) {

                            const dateA =
                                getTimestampValue(
                                    a.createdAt
                                );

                            const dateB =
                                getTimestampValue(
                                    b.createdAt
                                );

                            return dateB - dateA;

                        }
                    );


                    updateStatistics();

                    renderRequests();

                },

                function(error) {

                    console.error(
                        "REQUEST LOAD ERROR:",
                        error
                    );


                    requestsContainer.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                ⚠️
                            </div>

                            <h3>
                                Unable to Load Requests
                            </h3>

                            <p>
                                Please check your Firestore
                                security rules.
                            </p>

                        </div>

                    `;

                }
            );

        }


        /* =================================================
           STATISTICS
        ================================================= */

        function updateStatistics() {

            const total =
                allRequests.length;


            const pending =
                allRequests.filter(
                    request =>
                        request.status === "pending"
                ).length;


            const approved =
                allRequests.filter(
                    request =>
                        request.status === "approved"
                ).length;


            const rejected =
                allRequests.filter(
                    request =>
                        request.status === "rejected"
                ).length;


            totalCount.textContent =
                total;

            pendingCount.textContent =
                pending;

            approvedCount.textContent =
                approved;

            rejectedCount.textContent =
                rejected;

        }


        /* =================================================
           FILTER BUTTONS
        ================================================= */

        document
            .querySelectorAll(".filter-btn")
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            document
                                .querySelectorAll(
                                    ".filter-btn"
                                )
                                .forEach(
                                    btn =>
                                        btn.classList.remove(
                                            "active"
                                        )
                                );


                            this.classList.add(
                                "active"
                            );


                            currentFilter =
                                this.dataset.filter;


                            renderRequests();

                        }
                    );

                }
            );


        /* =================================================
           SEARCH
        ================================================= */

        searchInput.addEventListener(
            "input",
            function() {

                currentSearch =
                    this.value
                        .trim()
                        .toLowerCase();

                renderRequests();

            }
        );


        /* =================================================
           RENDER REQUESTS
        ================================================= */

        function renderRequests() {

            let filtered =
                [...allRequests];


            /* -----------------------------------------
               FILTER
            ----------------------------------------- */

            if (
                currentFilter !== "all"
            ) {

                filtered =
                    filtered.filter(
                        request =>
                            request.status ===
                            currentFilter
                    );

            }


            /* -----------------------------------------
               SEARCH
            ----------------------------------------- */

            if (currentSearch) {

                filtered =
                    filtered.filter(
                        function(request) {

                            const username =
                                String(
                                    request.tiktokUsername || ""
                                ).toLowerCase();


                            const displayName =
                                String(
                                    request.displayName || ""
                                ).toLowerCase();


                            const referredBy =
                                String(
                                    request.referredBy || ""
                                ).toLowerCase();


                            return (
                                username.includes(
                                    currentSearch
                                ) ||
                                displayName.includes(
                                    currentSearch
                                ) ||
                                referredBy.includes(
                                    currentSearch
                                )
                            );

                        }
                    );

            }


            /* -----------------------------------------
               EMPTY
            ----------------------------------------- */

            if (
                filtered.length === 0
            ) {

                requestsContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            📭
                        </div>

                        <h3>
                            No Join Requests
                        </h3>

                        <p>
                            There are no requests matching
                            your current filter.
                        </p>

                    </div>

                `;

                return;

            }


            /* -----------------------------------------
               RENDER
            ----------------------------------------- */

            requestsContainer.innerHTML =
                filtered
                    .map(
                        request =>
                            createRequestCard(
                                request
                            )
                    )
                    .join("");


            attachActionEvents();

        }


        /* =================================================
           CREATE REQUEST CARD
        ================================================= */

        function createRequestCard(
            request
        ) {

            const status =
                request.status || "pending";


            const statusClass =
                "status-" + status;


            const statusText =
                status.toUpperCase();


            const date =
                formatDate(
                    request.createdAt
                );


            const message =
                request.message ||
                "No message provided.";


            return `

                <article
                    class="request-card"
                    data-id="${escapeHTML(request.id)}"
                >

                    <div class="request-header">

                        <div class="request-user">

                            <div class="user-avatar">
                                👤
                            </div>

                            <div class="user-info">

                                <h3>
                                    ${escapeHTML(
                                        request.displayName ||
                                        "Unknown Member"
                                    )}
                                </h3>

                                <p>
                                    @${escapeHTML(
                                        cleanUsername(
                                            request.tiktokUsername
                                        )
                                    )}
                                </p>

                            </div>

                        </div>


                        <span
                            class="
                                status-badge
                                ${statusClass}
                            "
                        >
                            ${statusText}
                        </span>

                    </div>


                    <div class="request-details">

                        <div class="detail-box">

                            <div class="detail-label">
                                TikTok Username
                            </div>

                            <div class="detail-value">
                                @${escapeHTML(
                                    cleanUsername(
                                        request.tiktokUsername
                                    )
                                )}
                            </div>

                        </div>


                        <div class="detail-box">

                            <div class="detail-label">
                                Display Name
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    request.displayName ||
                                    "—"
                                )}
                            </div>

                        </div>


                        <div class="detail-box">

                            <div class="detail-label">
                                Referred By
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    request.referredBy ||
                                    "—"
                                )}
                            </div>

                        </div>

                    </div>


                    <div class="request-message">

                        <div class="message-label">
                            Message to Admin
                        </div>

                        <p>
                            ${escapeHTML(message)}
                        </p>

                    </div>


                    <div class="request-footer">

                        <div class="request-date">

                            Submitted:
                            ${escapeHTML(date)}

                        </div>


                        <div class="request-actions">

                            ${
                                status !== "approved"
                                ?
                                `
                                <button
                                    class="
                                        action-btn
                                        approve-btn
                                    "
                                    data-action="approve"
                                    data-id="${escapeHTML(
                                        request.id
                                    )}"
                                >
                                    ✓ APPROVE
                                </button>
                                `
                                :
                                ""
                            }


                            ${
                                status !== "rejected"
                                ?
                                `
                                <button
                                    class="
                                        action-btn
                                        reject-btn
                                    "
                                    data-action="reject"
                                    data-id="${escapeHTML(
                                        request.id
                                    )}"
                                >
                                    ✕ REJECT
                                </button>
                                `
                                :
                                ""
                            }


                            <button
                                class="
                                    action-btn
                                    delete-btn
                                "
                                data-action="delete"
                                data-id="${escapeHTML(
                                    request.id
                                )}"
                            >
                                🗑 DELETE
                            </button>

                        </div>

                    </div>

                </article>

            `;

        }


        /* =================================================
           ACTION EVENTS
        ================================================= */

        function attachActionEvents() {

            document
                .querySelectorAll(
                    "[data-action]"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const action =
                                    this.dataset.action;

                                const id =
                                    this.dataset.id;


                                if (
                                    action ===
                                    "approve"
                                ) {

                                    await changeStatus(
                                        id,
                                        "approved"
                                    );

                                }


                                if (
                                    action ===
                                    "reject"
                                ) {

                                    await changeStatus(
                                        id,
                                        "rejected"
                                    );

                                }


                                if (
                                    action ===
                                    "delete"
                                ) {

                                    await deleteRequest(
                                        id
                                    );

                                }

                            }
                        );

                    }
                );

        }


        /* =================================================
           CHANGE STATUS
        ================================================= */

        async function changeStatus(
            id,
            status
        ) {

            const actionText =
                status === "approved"
                    ? "approve"
                    : "reject";


            const confirmed =
                confirm(
                    `Are you sure you want to ${actionText} this request?`
                );


            if (!confirmed) {
                return;
            }


            try {

                const user =
                    auth.currentUser;


                await updateDoc(
                    doc(
                        db,
                        "memberRequests",
                        id
                    ),
                    {

                        status:
                            status,

                        reviewedAt:
                            serverTimestamp(),

                        reviewedBy:
                            user
                                ? user.email
                                : "admin"

                    }
                );


            } catch (error) {

                console.error(
                    "STATUS UPDATE ERROR:",
                    error
                );


                alert(
                    "Unable to update this request. Please check Firestore permissions."
                );

            }

        }


        /* =================================================
           DELETE REQUEST
        ================================================= */

        async function deleteRequest(
            id
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to permanently delete this request?"
                );


            if (!confirmed) {
                return;
            }


            try {

                await deleteDoc(
                    doc(
                        db,
                        "memberRequests",
                        id
                    )
                );


            } catch (error) {

                console.error(
                    "DELETE ERROR:",
                    error
                );


                alert(
                    "Unable to delete this request. Please check Firestore permissions."
                );

            }

        }


        /* =================================================
           CLEAN USERNAME
        ================================================= */

        function cleanUsername(
            username
        ) {

            return String(
                username || ""
            ).replace(
                /^@/,
                ""
            );

        }


        /* =================================================
           DATE
        ================================================= */

        function getTimestampValue(
            timestamp
        ) {

            if (!timestamp) {
                return 0;
            }


            if (
                typeof timestamp.toMillis ===
                "function"
            ) {

                return timestamp.toMillis();

            }


            if (
                timestamp.seconds
            ) {

                return timestamp.seconds *
                    1000;

            }


            if (
                timestamp instanceof Date
            ) {

                return timestamp.getTime();

            }


            return 0;

        }


        function formatDate(
            timestamp
        ) {

            const value =
                getTimestampValue(
                    timestamp
                );


            if (!value) {

                return "Just now";

            }


            return new Date(
                value
            ).toLocaleString(
                undefined,
                {
                    year: "numeric",
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        /* =================================================
           HTML ESCAPE
        ================================================= */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =================================================
           LOGOUT
        ================================================= */

        logoutBtn.addEventListener(
            "click",
            async function() {

                const confirmed =
                    confirm(
                        "Are you sure you want to logout?"
                    );


                if (!confirmed) {
                    return;
                }


                try {

                    await signOut(
                        auth
                    );


                    window.location.href =
                        "login.html";


                } catch (error) {

                    console.error(
                        "LOGOUT ERROR:",
                        error
                    );

                    alert(
                        "Unable to logout."
                    );

                }

            }
        );

    </script>


</body>

</html>
