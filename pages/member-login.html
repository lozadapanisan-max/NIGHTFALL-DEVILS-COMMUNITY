<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="description"
        content="NIGHTFALL DEVILS Member Login"
    >

    <title>Member Login | NIGHTFALL DEVILS</title>

    <style>
        :root {
            --red: #d71920;
            --gold: #f5c542;
            --black: #050505;
            --dark: #0b0b0b;
            --card: #111111;
            --border: #292929;
            --text: #ffffff;
            --muted: #999999;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    rgba(215, 25, 32, 0.15),
                    transparent 40%
                ),
                var(--black);
            color: var(--text);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 12px;
        }

        .brand h1 {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .brand h1 span {
            color: var(--red);
        }

        .brand p {
            margin-top: 5px;
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 2px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 28px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
        }

        .card-title {
            text-align: center;
            margin-bottom: 23px;
        }

        .card-title h2 {
            font-size: 20px;
            font-weight: 850;
        }

        .card-title p {
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
            outline: none;
            background: #151515;
            color: white;
            transition: .2s;
        }

        .input:focus {
            border-color: var(--gold);
            box-shadow:
                0 0 0 3px rgba(245,197,66,.08);
        }

        .input::placeholder {
            color: #666;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .input {
            padding-right: 48px;
        }

        .show-password {
            position: absolute;
            right: 5px;
            top: 5px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--gold);
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            height: 51px;
            margin-top: 5px;
            border: 0;
            border-radius: 9px;
            background: var(--red);
            color: white;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: .2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: #ed1c24;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            display: none;
            padding: 12px 13px;
            margin-bottom: 17px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
        }

        .status.show {
            display: block;
        }

        .status.error {
            background: rgba(239,68,68,.1);
            border: 1px solid rgba(239,68,68,.3);
            color: #ffb4b4;
        }

        .status.success {
            background: rgba(34,197,94,.1);
            border: 1px solid rgba(34,197,94,.3);
            color: #b8f5ca;
        }

        .status.info {
            background: rgba(245,197,66,.08);
            border: 1px solid rgba(245,197,66,.25);
            color: #ffe9a0;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            line-height: 2;
        }

        .links a {
            color: var(--gold);
            font-weight: 700;
        }

        .links a:hover {
            color: white;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }

        .back {
            display: block;
            text-align: center;
            color: #777;
            font-size: 11px;
        }

        .back:hover {
            color: var(--gold);
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: -3px;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:450px) {

            .card {
                padding: 22px 17px;
            }

            .brand h1 {
                font-size: 22px;
            }

        }
    </style>
</head>

<body>

    <main class="page">

        <div class="login-wrapper">

            <div class="brand">

                <img
                    src="../assets/logo.png"
                    alt="NIGHTFALL DEVILS"
                    class="logo"
                    onerror="this.style.display='none';"
                >

                <h1>
                    NIGHTFALL <span>DEVILS</span>
                </h1>

                <p>
                    MEMBER PORTAL
                </p>

            </div>


            <section class="card">

                <div class="card-title">

                    <h2>
                        👿 Member Login
                    </h2>

                    <p>
                        Login to access your member dashboard.
                    </p>

                </div>


                <div
                    id="status"
                    class="status"
                    role="alert"
                ></div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="input"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrap">

                            <input
                                type="password"
                                id="password"
                                class="input"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="showPassword"
                                class="show-password"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        id="loginBtn"
                        class="login-btn"
                    >
                        🔐 LOGIN
                    </button>

                </form>


                <div class="links">

                    <div>
                        Don't have an account?
                        <a href="member-register.html">
                            Register here
                        </a>
                    </div>

                    <div>
                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>
                    </div>

                </div>


                <div class="divider"></div>


                <a
                    href="../index.html"
                    class="back"
                >
                    ← Back to NIGHTFALL DEVILS Website
                </a>

            </section>

        </div>

    </main>


    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from
        "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs
        } from
        "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


        /* ==========================================
           FIREBASE CONFIG
        ========================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBLmbuGW9dUPCFBrkPFqGDKwZYvRkHqxQ",

            authDomain:
                "nightfall-devils-b0d77.firebaseapp.com",

            projectId:
                "nightfall-devils-b0d77",

            storageBucket:
                "nightfall-devils-b0d77.firebasestorage.app",

            messagingSenderId:
                "758952684668",

            appId:
                "1:758952684668:web:5be641ca90c9d5134f2df9",

            measurementId:
                "G-R6MZ05M4DR"

        };


        /* ==========================================
           INITIALIZE
        ========================================== */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        /* ==========================================
           ELEMENTS
        ========================================== */

        const loginForm =
            document.getElementById("loginForm");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const loginBtn =
            document.getElementById("loginBtn");

        const status =
            document.getElementById("status");

        const showPassword =
            document.getElementById("showPassword");

        const forgotPassword =
            document.getElementById("forgotPassword");


        /* ==========================================
           STATUS
        ========================================== */

        function showStatus(
            message,
            type = "info"
        ) {

            status.textContent = message;

            status.className =
                "status show " + type;

        }


        function clearStatus() {

            status.textContent = "";

            status.className = "status";

        }


        /* ==========================================
           PASSWORD SHOW/HIDE
        ========================================== */

        showPassword.addEventListener(
            "click",
            function() {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    showPassword.textContent = "🙈";

                } else {

                    password.type = "password";

                    showPassword.textContent = "👁";

                }

            }
        );


        /* ==========================================
           LOGIN
        ========================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                clearStatus();

                const userEmail =
                    email.value
                        .trim()
                        .toLowerCase();

                const userPassword =
                    password.value;


                if (!userEmail) {

                    showStatus(
                        "Please enter your email address.",
                        "error"
                    );

                    email.focus();

                    return;

                }


                if (!userPassword) {

                    showStatus(
                        "Please enter your password.",
                        "error"
                    );

                    password.focus();

                    return;

                }


                loginBtn.disabled = true;

                loginBtn.innerHTML =
                    '<span class="spinner"></span> LOGGING IN...';


                try {

                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            userEmail,
                            userPassword
                        );


                    const user =
                        credential.user;


                    /*
                     * Check if the logged-in account
                     * has an approved member record.
                     */

                    const membersRef =
                        collection(
                            db,
                            "members"
                        );


                    const memberQuery =
                        query(
                            membersRef,
                            where(
                                "email",
                                "==",
                                userEmail
                            )
                        );


                    const memberSnapshot =
                        await getDocs(
                            memberQuery
                        );


                    if (
                        memberSnapshot.empty
                    ) {

                        /*
                         * Account exists in Firebase Auth
                         * but no approved member profile.
                         */

                        showStatus(
                            "Your account is not yet registered as an approved NIGHTFALL DEVILS member.",
                            "error"
                        );

                        await auth.signOut();

                        loginBtn.disabled = false;

                        loginBtn.innerHTML =
                            "🔐 LOGIN";

                        return;

                    }


                    const memberDoc =
                        memberSnapshot.docs[0];

                    const memberData =
                        memberDoc.data();


                    /*
                     * Optional member status check.
                     */

                    if (
                        memberData.status &&
                        memberData.status !== "approved" &&
                        memberData.status !== "active"
                    ) {

                        showStatus(
                            "Your membership is currently not active. Please contact the NIGHTFALL DEVILS admin.",
                            "error"
                        );

                        await auth.signOut();

                        loginBtn.disabled = false;

                        loginBtn.innerHTML =
                            "🔐 LOGIN";

                        return;

                    }


                    showStatus(
                        "✅ Login successful. Opening your member dashboard...",
                        "success"
                    );


                    /*
                     * Save member document ID locally
                     * for dashboard use.
                     */

                    localStorage.setItem(
                        "nightfallMemberId",
                        memberDoc.id
                    );


                    localStorage.setItem(
                        "nightfallMemberUsername",
                        memberData.tiktokUsername || ""
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "member-dashboard.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(
                        "Member login error:",
                        error
                    );


                    let message =
                        "Unable to login. Please check your email and password.";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        message =
                            "Incorrect email or password.";

                    } else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        message =
                            "No account was found with this email.";

                    } else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        message =
                            "Incorrect password.";

                    } else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        message =
                            "Please enter a valid email address.";

                    } else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        message =
                            "Too many login attempts. Please try again later.";

                    } else if (
                        error.code ===
                        "permission-denied"
                    ) {

                        message =
                            "Firebase permission denied. Please check Firestore Rules.";

                    }


                    showStatus(
                        "❌ " + message,
                        "error"
                    );


                    loginBtn.disabled = false;

                    loginBtn.innerHTML =
                        "🔐 LOGIN";

                }

            }
        );


        /* ==========================================
           FORGOT PASSWORD
        ========================================== */

        forgotPassword.addEventListener(
            "click",
            async function(event) {

                event.preventDefault();

                clearStatus();

                const userEmail =
                    email.value
                        .trim()
                        .toLowerCase();


                if (!userEmail) {

                    showStatus(
                        "Enter your email address first, then click Forgot Password.",
                        "info"
                    );

                    email.focus();

                    return;

                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        userEmail
                    );


                    showStatus(
                        "✅ Password reset email sent. Please check your email.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );


                    let message =
                        "Unable to send password reset email.";


                    if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        message =
                            "No account was found with this email.";

                    } else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        message =
                            "Please enter a valid email address.";

                    }


                    showStatus(
                        "❌ " + message,
                        "error"
                    );

                }

            }
        );


        /* ==========================================
           CHECK CURRENT LOGIN
        ========================================== */

        onAuthStateChanged(
            auth,
            function(user) {

                if (user) {

                    /*
                     * Do not automatically redirect here.
                     * This allows the user to see the page
                     * after returning from another screen.
                     */

                    console.log(
                        "Authenticated member:",
                        user.email
                    );

                }

            }
        );


        console.log(
            "NIGHTFALL DEVILS member login ready."
        );

    </script>

</body>

</html>
