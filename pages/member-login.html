<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>NIGHTFALL DEVILS - Member Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red: #d71920;
            --red-dark: #a90f15;
            --gold: #f5c542;
            --black: #050505;
            --card: #111111;
            --border: #292929;
            --text: #ffffff;
            --muted: #999999;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(215, 25, 32, 0.15),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(245, 197, 66, 0.07),
                    transparent 35%
                ),
                var(--black);
            color: var(--text);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 14px;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand img {
            width: 78px;
            height: 78px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .brand-title {
            color: var(--gold);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 25px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .description {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 12px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: rgba(215, 25, 32, 0.10);
            border: 1px solid rgba(215, 25, 32, 0.35);
            color: #ff8b8b;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #6ee7a0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #ccc;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border-radius: 9px;
            border: 1px solid #303030;
            outline: none;
            background: #090909;
            color: #fff;
            font-size: 13px;
        }

        input::placeholder {
            color: #555;
        }

        input:focus {
            border-color: var(--gold);
        }

        .forgot {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 17px;
        }

        .forgot button {
            background: none;
            border: 0;
            color: var(--gold);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: 1px solid #6b1818;
            border-radius: 9px;
            background:
                linear-gradient(
                    135deg,
                    var(--red),
                    var(--red-dark)
                );
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
        }

        .login-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .register-box {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #222;
            color: #777;
            font-size: 12px;
        }

        .register-box a {
            color: var(--gold);
            font-weight: 800;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 17px;
            color: #777;
            font-size: 11px;
        }

        .home-link:hover {
            color: var(--gold);
        }

        .loading {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(5, 5, 5, 0.94);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 12px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #292929;
            border-top-color: var(--red);
            border-right-color: var(--gold);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .loading-text {
            color: #aaa;
            font-size: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 500px) {

            .card {
                padding: 20px 16px;
            }

            .brand img {
                width: 65px;
                height: 65px;
            }

            .brand-title {
                font-size: 20px;
            }

            .title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div
        id="loading"
        class="loading"
    >
        <div class="spinner"></div>

        <div class="loading-text">
            Signing in...
        </div>
    </div>


    <main class="page">

        <div class="wrapper">

            <div class="brand">

                <img
                    src="../assets/logo.png"
                    alt="NIGHTFALL DEVILS"
                >

                <div class="brand-title">
                    NIGHTFALL DEVILS
                </div>

                <div class="brand-subtitle">
                    MEMBER PORTAL
                </div>

            </div>


            <section class="card">

                <h1 class="title">
                    MEMBER LOGIN
                </h1>

                <p class="description">
                    Login to access your NIGHTFALL DEVILS
                    Member Dashboard.
                </p>


                <div
                    id="message"
                    class="message"
                ></div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            EMAIL ADDRESS
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            PASSWORD
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <div class="forgot">

                        <button
                            type="button"
                            id="forgotBtn"
                        >
                            Forgot Password?
                        </button>

                    </div>


                    <button
                        type="submit"
                        id="loginBtn"
                        class="login-btn"
                    >
                        LOGIN
                    </button>

                </form>


                <div class="register-box">

                    Don't have an account?

                    <a href="../member-register.html">
                        CREATE ACCOUNT
                    </a>

                </div>


                <a
                    href="../index.html"
                    class="home-link"
                >
                    ← Back to Home
                </a>

            </section>

        </div>

    </main>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyBLmbuGW9dUPCFBrkPFqGDKwZYvRkHqxQ",

            authDomain:
                "nightfall-devils-b0d77.firebaseapp.com",

            projectId:
                "nightfall-devils-b0d77",

            storageBucket:
                "nightfall-devils-b0d77.firebasestorage.app",

            messagingSenderId:
                "758952684668",

            appId:
                "1:758952684668:web:5be641ca90c9d5134f2df9",

            measurementId:
                "G-R6MZ05M4DR"
        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const emailInput =
            document.getElementById(
                "email"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const loginBtn =
            document.getElementById(
                "loginBtn"
            );

        const forgotBtn =
            document.getElementById(
                "forgotBtn"
            );

        const message =
            document.getElementById(
                "message"
            );

        const loading =
            document.getElementById(
                "loading"
            );


        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;
        }


        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "message";
        }


        function setLoading(
            state,
            text = "Signing in..."
        ) {

            if (state) {

                loading.querySelector(
                    ".loading-text"
                ).textContent = text;

                loading.classList.add(
                    "show"
                );

                loginBtn.disabled =
                    true;

            } else {

                loading.classList.remove(
                    "show"
                );

                loginBtn.disabled =
                    false;

            }

        }


        function firebaseError(
            error
        ) {

            switch (
                error?.code
            ) {

                case "auth/invalid-credential":
                case "auth/invalid-login-credentials":
                    return "Incorrect email or password.";

                case "auth/user-not-found":
                    return "Incorrect email or password.";

                case "auth/wrong-password":
                    return "Incorrect email or password.";

                case "auth/invalid-email":
                    return "Please enter a valid email address.";

                case "auth/too-many-requests":
                    return "Too many login attempts. Please try again later.";

                case "auth/network-request-failed":
                    return "Network error. Please check your internet connection.";

                default:
                    return (
                        error?.message ||
                        "Unable to login. Please try again."
                    );
            }

        }


        /*
         * If already logged in,
         * go directly to dashboard.
         */

        onAuthStateChanged(
            auth,
            (user) => {

                if (user) {

                    window.location.replace(
                        "member-dashboard.html"
                    );

                }

            }
        );


        /*
         * LOGIN
         */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                clearMessage();

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password."
                    );

                    return;
                }


                try {

                    setLoading(
                        true,
                        "Signing in..."
                    );


                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        credential.user;


                    /*
                     * Read users/{uid}
                     */

                    let userData = null;

                    try {

                        const userSnap =
                            await getDoc(
                                doc(
                                    db,
                                    "users",
                                    user.uid
                                )
                            );

                        if (
                            userSnap.exists()
                        ) {

                            userData =
                                userSnap.data();

                        }

                    } catch (
                        firestoreError
                    ) {

                        console.warn(
                            "Unable to read user profile:",
                            firestoreError
                        );

                    }


                    /*
                     * Save local session information.
                     */

                    localStorage.setItem(
                        "nightfallMemberEmail",
                        user.email || email
                    );

                    localStorage.setItem(
                        "nightfallMemberName",
                        user.displayName ||
                        userData?.displayName ||
                        ""
                    );

                    localStorage.setItem(
                        "nightfallMemberStatus",
                        userData?.membershipStatus ||
                        "not_requested"
                    );


                    /*
                     * Dashboard handles:
                     *
                     * NOT REQUESTED
                     * PENDING
                     * APPROVED
                     * REJECTED
                     */

                    window.location.replace(
                        "member-dashboard.html"
                    );

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    setLoading(false);

                    showMessage(
                        firebaseError(error),
                        "error"
                    );

                }

            }
        );


        /*
         * FORGOT PASSWORD
         */

        forgotBtn.addEventListener(
            "click",
            async () => {

                clearMessage();

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    showMessage(
                        "Enter your email address first, then click Forgot Password."
                    );

                    emailInput.focus();

                    return;
                }


                try {

                    setLoading(
                        true,
                        "Sending password reset email..."
                    );


                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    setLoading(false);

                    showMessage(
                        "If the email is registered, a password reset email has been sent.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );

                    setLoading(false);

                    /*
                     * Generic message helps avoid
                     * revealing whether an email
                     * exists.
                     */

                    showMessage(
                        "If the email is registered, a password reset email has been sent.",
                        "success"
                    );

                }

            }
        );

    </script>

</body>

</html>
